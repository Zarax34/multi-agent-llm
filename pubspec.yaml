name: multi_agent_llm
description: Multi-Agent LLM System - Run models locally or connect to Ollama
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  nobodywho: ^0.5.2
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  dio: ^5.4.0
  web_socket_channel: ^3.0.1
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  file_picker: ^8.0.0
  permission_handler: ^11.3.1
  uuid: ^4.3.3
  intl: ^0.20.0
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
