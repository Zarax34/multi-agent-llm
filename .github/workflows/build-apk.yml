name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Recreate Android project
        run: |
          rm -rf android
          flutter create --org com.example --project-name multi_agent_llm --platforms android .
          git checkout -- pubspec.yaml lib/

      - name: Accept licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="build-$(echo ${{ github.sha }} | cut -c1-7)"
          gh release create "$VERSION" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Multi-Agent LLM $VERSION" \
            --notes "Auto-built APK" \
            --prerelease \
            || true
          
          gh release upload "$VERSION" \
            build/app/outputs/flutter-apk/app-release.apk \
            --clobber \
            || true
